name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Active LTS (Krypton); keep in step with the Dockerfile
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Engine tests
        run: pnpm vitest run
      - name: Build
        run: pnpm build
        env:
          # Satisfies lib/env.ts validation during page-data collection; the
          # running server always gets its real secret from the deploy .env.
          AUTH_SECRET: insecure-build-time-placeholder

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase) and short-sha tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push image (arm64, matching the OCI host)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # Everything host-specific comes from the "oracle-cloud" GitHub environment,
    # which is the single source of truth for the server's .env:
    #   vars:    OCI_HOST, OCI_USER, OCI_SSH_PORT (optional), DEPLOY_DIR,
    #            APP_PORT, APP_BIND, DB_PORT, AUTH_URL,
    #            RANKED_MIN_RESOLVED, LLM_BASE_URL, LLM_MODEL
    #   secrets: OCI_SSH_KEY, POSTGRES_PASSWORD, AUTH_SECRET,
    #            AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, LLM_API_KEY
    # The registry pull uses this run's ephemeral GITHUB_TOKEN — no PAT needed.
    environment: oracle-cloud
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-oracle-cloud
      cancel-in-progress: false
    steps:
      # A single SSH step does the whole deploy, so the connection inputs
      # (host/user/port/key) are written once rather than repeated per step.
      # The host needs no checkout: it pulls the compose file for this exact
      # commit straight from the API, and renders .env from the environment.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
          APP_PORT: ${{ vars.APP_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USER }}
          port: ${{ vars.OCI_SSH_PORT || 22 }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: APP_IMAGE,APP_PORT,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN,REPO,SHA
          script: |
            set -euo pipefail

            # DEPLOY_DIR may not exist on a fresh host. Parents like /opt are
            # root-owned, so fall back to sudo and hand the dir to the SSH user.
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR" 2>/dev/null || {
                sudo mkdir -p "$DEPLOY_DIR"
                sudo chown "$(id -u):$(id -g)" "$DEPLOY_DIR"
              }
            fi
            cd "$DEPLOY_DIR"

            # Take the compose file from the exact commit being deployed, so the
            # host can never drift from the repo. The run's own GITHUB_TOKEN
            # authenticates, which keeps working if the repo goes private.
            curl -fsSL \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/$REPO/contents/docker-compose.yml?ref=$SHA" \
              -o docker-compose.yml

            # .env is rendered fresh on every deploy from the oracle-cloud
            # environment — edit a var/secret there and redeploy, never edit the
            # server by hand. Quoted heredoc: values are written verbatim, and
            # GitHub masks the secret values in the run log.
            umask 077
            cat > .env <<'ENV_EOF'
            APP_PORT=${{ vars.APP_PORT }}
            APP_BIND=${{ vars.APP_BIND }}
            DB_PORT=${{ vars.DB_PORT }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_URL=${{ vars.AUTH_URL }}
            AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            AUTH_DEV_LOGIN=false
            RANKED_MIN_RESOLVED=${{ vars.RANKED_MIN_RESOLVED }}
            LLM_BASE_URL=${{ vars.LLM_BASE_URL }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_MODEL=${{ vars.LLM_MODEL }}
            ENV_EOF

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose pull app
            docker compose up -d --no-build app

            # `up -d` returns once the container has STARTED, which is not the
            # same as serving: an app that boots and crashes (bad env, failed
            # DB connect) would otherwise deploy green. Poll until it answers,
            # and fail the run with its logs if it never does. /signin is the
            # one page that needs no session.
            probe="http://127.0.0.1:${APP_PORT:-3000}/signin"
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 -o /dev/null "$probe"; then
                echo "app is serving ($probe)"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "app never served $probe after 60s; last 50 log lines:" >&2
                docker compose logs --tail=50 app >&2
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
            docker compose ps
